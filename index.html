<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meal Planner</title>
<meta name="theme-color" content="#2E4A3C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meal Planner">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=Public+Sans:ital,wght@0,300..700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16211C;
  --paper:#E9EDE7;
  --card:#FBFCF9;
  --moss:#2E4A3C;
  --moss-2:#3F6350;
  --ochre:#C8892A;
  --brick:#A6402E;
  --leaf:#4C7A3F;
  --muted:#6E8377;
  --line:#CDD6CC;
  --rail:#C3CFC4;
  --shadow:0 1px 0 rgba(22,33,28,.06), 0 6px 18px -12px rgba(22,33,28,.35);
  --tabh:64px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Public Sans",system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--moss)}

/* ---------- shell ---------- */
.wrap{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;background:var(--moss);color:#EAF0EA;
  padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
}
.topbar h1{
  font-family:"Bricolage Grotesque",sans-serif;
  font-weight:700;font-size:19px;letter-spacing:-.02em;margin:0;
}
.topbar .who{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.72}
.topbar .who button{color:inherit;text-decoration:underline;text-underline-offset:3px;opacity:.9}
.main{flex:1;padding:16px 14px calc(var(--tabh) + env(safe-area-inset-bottom) + 26px)}

/* ---------- tabs ---------- */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;
}
.tabs-inner{max-width:560px;margin:0 auto;display:flex;width:100%}
.tab{
  position:relative;
  flex:1;height:var(--tabh);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;
  font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);
}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--moss)}
.tab[aria-current="page"] svg{stroke-width:2.1}
.tab .dot{
  position:absolute;top:14px;left:calc(50% + 10px);
  width:6px;height:6px;border-radius:50%;background:var(--ochre);opacity:0;
}
.tab[data-count]:not([data-count="0"]) .dot{opacity:1}

/* ---------- generic bits ---------- */
.eyebrow{
  font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin:0 0 10px;
}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--moss);color:#F2F6F1;border-radius:10px;
  padding:12px 16px;font-weight:600;font-size:15px;min-height:46px;
}
.btn:active{background:var(--moss-2)}
.btn-ghost{background:transparent;color:var(--moss);border:1px solid var(--line)}
.btn-ghost:active{background:#E1E7E0}
.btn-danger{background:transparent;color:var(--brick);border:1px solid #E0C6C0}
.btn-block{display:flex;width:100%}
.field{margin-bottom:16px}
.field label{display:block;font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.input,textarea.input,select.input{
  width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;font-size:16px;
}
.input:focus,.chip:focus-visible,.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
textarea.input{min-height:150px;resize:vertical;line-height:1.5;font-family:"DM Mono",monospace;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quickadd{display:flex;gap:8px;align-items:stretch;margin-bottom:12px}
.quickadd .input{flex:1;min-width:0}
.quickadd .btn{flex:0 0 auto;padding:8px 18px}
.urlrow{display:flex;gap:8px;align-items:stretch}
.urlrow .input{flex:1;min-width:0}
.urlrow .btn{flex:0 0 auto;padding:8px 15px}
.btn:disabled{opacity:.55;cursor:default}
/* confirmation state — the button itself becomes the receipt */
.btn.is-saved,.btn.is-saved:disabled{background:var(--leaf);border-color:var(--leaf);color:#F4F8F1;opacity:1}
.savebar{display:flex;gap:9px}
.savebar .btn{flex:1}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.empty{text-align:center;padding:44px 22px;color:var(--muted)}
.empty h3{font-family:"Bricolage Grotesque",sans-serif;font-size:18px;color:var(--ink);margin:0 0 6px}
.empty p{margin:0 0 16px;font-size:14.5px}

/* segmented 1-5 */
.seg{display:flex;gap:6px}
.seg button{
  flex:1;min-height:44px;border:1px solid var(--line);border-radius:9px;background:var(--card);
  font-family:"DM Mono",monospace;font-size:14px;color:var(--muted);
}
.seg button[aria-pressed="true"]{background:var(--moss);border-color:var(--moss);color:#F2F6F1}

/* chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 14px 12px;margin:0 -14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:7px 13px;font-size:13.5px;white-space:nowrap;color:var(--muted);
}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#EDF1EC}

/* diet tag */
.tag{
  font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  padding:3px 7px;border-radius:5px;border:1px solid;
}
.tag.meat{color:var(--brick);border-color:#E2C7C1;background:#F8EFEC}
.tag.vegetarian{color:var(--moss);border-color:#C6D6C8;background:#EDF3EC}
.tag.vegan{color:var(--leaf);border-color:#C8DCBE;background:#EFF5EA}
.fav{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ochre);border:1px solid #E6D2AE;background:#FAF3E5;padding:3px 7px;border-radius:5px}

/* ---------- recipe list ---------- */
.rlist{display:flex;flex-direction:column;gap:10px;margin-top:2px}
.ritem{
  display:block;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:13px 14px;box-shadow:var(--shadow);
}
.ritem:active{background:#F3F6F2}
.ritem h3{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:17px;
  letter-spacing:-.015em;margin:0 0 7px;line-height:1.25;
}
.rtags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.rdata{
  display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;
  font-family:"DM Mono",monospace;font-size:12px;color:var(--muted);
  border-top:1px dashed var(--line);padding-top:8px;
}
.rdata b{color:var(--ink);font-weight:500}
.rdata .sep{color:var(--rail)}

/* ---------- planner rail ---------- */
.rail{position:relative;margin:4px 0 0;padding-left:34px}
.rail::before{content:"";position:absolute;left:9px;top:12px;bottom:12px;width:2px;background:var(--rail);border-radius:2px}
.day{position:relative;margin-bottom:9px}
.day::before{
  content:"";position:absolute;left:-30px;top:19px;width:12px;height:12px;border-radius:50%;
  background:var(--paper);border:2px solid var(--rail);
}
.day.today::before{background:var(--ochre);border-color:var(--ochre)}
.daybtn{
  display:flex;width:100%;text-align:left;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:11px 13px;min-height:60px;box-shadow:var(--shadow);
}
.day.today .daybtn{border-color:var(--ochre)}
.daybtn:active{background:#F3F6F2}
.dstamp{flex:0 0 46px}
.dstamp .dow{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:block}
.dstamp .num{font-family:"Bricolage Grotesque",sans-serif;font-size:21px;font-weight:600;line-height:1.05;display:block}
.day.today .dstamp .num{color:var(--ochre)}
.dmeal{flex:1;min-width:0}
.dmeal .name{font-weight:600;font-size:15.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmeal .none{color:var(--muted);font-size:15px}
.dmeal .sub{font-family:"DM Mono",monospace;font-size:11.5px;color:var(--muted);display:block;margin-top:2px}
.dclear{flex:0 0 auto;width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);border:1px solid var(--line)}

/* ---------- shopping ---------- */
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.shead h2{font-family:"Bricolage Grotesque",sans-serif;font-size:21px;letter-spacing:-.02em;margin:0 0 3px}
.slist{list-style:none;margin:0;padding:0}
.sitem{display:flex;align-items:flex-start;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.sbox{
  flex:0 0 22px;height:22px;margin-top:1px;border:2px solid var(--moss);border-radius:6px;
  display:flex;align-items:center;justify-content:center;
}
.sitem[aria-checked="true"] .sbox{background:var(--moss)}
.sbox svg{width:14px;height:14px;stroke:#F2F6F1;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.sitem[aria-checked="true"] .sbox svg{opacity:1}
.sitem[aria-checked="true"] .stext{color:var(--muted);text-decoration:line-through}
.stext{font-size:15.5px;line-height:1.35}
.sprog{font-family:"DM Mono",monospace;font-size:12px;color:var(--muted);white-space:nowrap}

/* ---------- method ---------- */
.method{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;margin-bottom:18px;box-shadow:var(--shadow);
}
.method .eyebrow{margin-bottom:9px}
.method ol{margin:0;padding-left:21px}
.method li{margin-bottom:10px;line-height:1.5;font-size:15px}
.method li:last-child{margin-bottom:0}
.method li::marker{font-family:"DM Mono",monospace;font-size:12.5px;color:var(--muted)}

/* ---------- sheet ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(22,33,28,.42);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s ease}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--paper);
  border-radius:18px 18px 0 0;max-width:560px;margin:0 auto;max-height:92dvh;
  display:flex;flex-direction:column;transform:translateY(100%);
  /* visibility, not just transform — otherwise the closed sheet stays in the
     tab order and the screen-reader tree. It flips only once the slide-out ends. */
  visibility:hidden;
  transition:transform .22s cubic-bezier(.32,.72,0,1), visibility .22s;
}
.sheet.open{transform:translateY(0);visibility:visible}
.sheet-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 16px 12px;border-bottom:1px solid var(--line);
}
.sheet-head h2{font-family:"Bricolage Grotesque",sans-serif;font-size:18px;letter-spacing:-.02em;margin:0}
.sheet-body{overflow-y:auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 22px);-webkit-overflow-scrolling:touch}
.grab{width:38px;height:4px;border-radius:4px;background:var(--rail);margin:8px auto 0}
.pickitem{display:flex;width:100%;text-align:left;gap:10px;align-items:center;padding:13px 6px;border-bottom:1px solid var(--line)}
.pickitem .nm{flex:1;font-weight:600;font-size:15.5px}
.pickitem .mt{font-family:"DM Mono",monospace;font-size:11.5px;color:var(--muted)}

/* ---------- gate ---------- */
.gate{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px;text-align:center;gap:6px}
.gate .mark{width:72px;height:72px;border-radius:20px;background:var(--moss);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.gate .mark svg{width:38px;height:38px;stroke:var(--ochre);fill:none;stroke-width:1.8;stroke-linecap:round}
.gate h1{font-family:"Bricolage Grotesque",sans-serif;font-size:27px;letter-spacing:-.03em;margin:0}
.gate p{color:var(--muted);max-width:32ch;margin:2px 0 20px;font-size:15px}
.uidbox{
  font-family:"DM Mono",monospace;font-size:12.5px;background:var(--card);border:1px solid var(--line);
  border-radius:9px;padding:11px 12px;word-break:break-all;margin:14px 0 10px;max-width:100%;
}
.toast{
  position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 18px);
  transform:translate(-50%,14px);background:var(--ink);color:#EDF1EC;
  padding:11px 17px;border-radius:10px;font-size:14px;z-index:80;
  opacity:0;pointer-events:none;transition:all .2s ease;max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none !important}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<!-- sign-in gate -->
<div id="gate" class="gate">
  <div class="mark">
    <svg viewBox="0 0 24 24"><path d="M3 11h18M5 11a7 7 0 0 1 14 0M4 15h16M7 19h10"/></svg>
  </div>
  <h1>Meal Planner</h1>
  <p id="gateMsg">Sign in to see your recipes and this week's plan.</p>
  <button id="signInBtn" class="btn">Sign in with Google</button>
  <div id="gateExtra" class="hidden"></div>
</div>

<!-- app -->
<div id="app" class="wrap hidden">
  <header class="topbar">
    <h1 id="viewTitle">Recipes</h1>
    <span class="who"><span id="whoName"></span> · <button id="signOutBtn">Sign out</button></span>
  </header>

  <main class="main">
    <!-- RECIPES -->
    <section id="view-recipes">
      <div class="chips" id="filterChips"></div>
      <div class="field" style="margin-bottom:12px">
        <input id="search" class="input" type="search" placeholder="Search name or ingredient" autocomplete="off">
      </div>
      <div class="field" style="margin-bottom:14px">
        <select id="sortBy" class="input">
          <option value="cost">Sort by cost per serving</option>
          <option value="health">Sort by healthiest</option>
          <option value="time">Sort by quickest</option>
          <option value="stale">Sort by not had in a while</option>
          <option value="eat">Sort by best to eat</option>
          <option value="wash">Sort by least washing up</option>
          <option value="name">Sort by name</option>
        </select>
      </div>
      <div id="recipeList" class="rlist"></div>
    </section>

    <!-- OUT -->
    <section id="view-out" class="hidden">
      <div class="quickadd">
        <input id="newPlace" class="input" placeholder="Add a place &mdash; just the name" autocomplete="off">
        <button class="btn" id="addPlace">Add</button>
      </div>
      <div class="chips" id="placeChips"></div>
      <div class="field" style="margin-bottom:14px">
        <select id="placeSort" class="input">
          <option value="stale">Sort by not been in a while</option>
          <option value="rating">Sort by best</option>
          <option value="spend">Sort by cheapest</option>
          <option value="name">Sort by name</option>
        </select>
      </div>
      <div id="placeList" class="rlist"></div>
    </section>

    <!-- PLAN -->
    <section id="view-plan" class="hidden">
      <p class="eyebrow" id="planCount">Next 10 days</p>
      <div class="rail" id="rail"></div>
    </section>

    <!-- SHOP -->
    <section id="view-shop" class="hidden">
      <div id="shopContent"></div>
    </section>

    <!-- ADD -->
    <section id="view-add" class="hidden">
      <p class="eyebrow">New recipe</p>
      <div id="addFormHost"></div>
    </section>
  </main>

  <nav class="tabs">
    <div class="tabs-inner">
      <button class="tab" data-view="recipes" aria-current="page">
        <svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H19v16H5.5A1.5 1.5 0 0 1 4 18.5zM8 8h7M8 12h7"/></svg>Recipes
      </button>
      <button class="tab" data-view="out">
        <svg viewBox="0 0 24 24"><path d="M7 3v7a2 2 0 0 0 4 0V3M9 10v11M16.5 3c-1.5 1.6-2 3.6-2 5.6 0 1.4.9 2.4 2 2.4V3zM16.5 11v10"/></svg>Out
      </button>
      <button class="tab" data-view="plan">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3.5v3M16 3.5v3"/></svg>Plan
      </button>
      <button class="tab" data-view="shop"><span class="dot"></span>
        <svg viewBox="0 0 24 24"><path d="M4 6h2l2.2 10.2a1.6 1.6 0 0 0 1.6 1.3h7.5a1.6 1.6 0 0 0 1.6-1.2L20.5 9H6.4"/><circle cx="10" cy="20" r="1"/><circle cx="17.5" cy="20" r="1"/></svg>Shop
      </button>
      <button class="tab" data-view="add">
        <svg viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></svg>Add
      </button>
    </div>
  </nav>
</div>

<div id="sheetBg" class="sheet-bg"></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grab"></div>
  <div class="sheet-head">
    <h2 id="sheetTitle">Recipe</h2>
    <button id="sheetClose" class="btn btn-ghost" style="padding:8px 14px">Close</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div id="toast" class="toast"></div>

<script src="config.js"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
         onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc,
         onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* ---------- config ---------- */
const CFG = window.APP_CONFIG;
if (!CFG || !CFG.firebase) {
  document.getElementById('gateMsg').textContent =
    'config.js is missing. Copy config.example.js to config.js and add your Firebase details.';
  document.getElementById('signInBtn').classList.add('hidden');
  throw new Error('missing config');
}
const COOKS = CFG.cooks || [{key:'a',name:'A'},{key:'b',name:'B'}];
const SPACE = CFG.spaceId || 'home';
const FETCHER = (CFG.recipeFetcher || '').trim();   // '' hides the Fetch button

const app = initializeApp(CFG.firebase);
const auth = getAuth(app);
const db = getFirestore(app);

const recipesCol = collection(db, 'spaces', SPACE, 'recipes');
const placesCol  = collection(db, 'spaces', SPACE, 'places');
const planCol    = collection(db, 'spaces', SPACE, 'plan');
const shopDoc    = doc(db, 'spaces', SPACE, 'meta', 'shopping');

/* ---------- state ---------- */
let recipes = [];            // {id, ...}
let places = [];             // {id, name, url, spend, rating, lastVisited}
let plan = {};               // 'YYYY-MM-DD' -> {recipeId} | {placeId}
let shopping = null;         // {recipeName, items:[{text,checked}]}
let view = 'recipes';
let filter = 'all';
let searchTerm = '';
let sortBy = 'cost';
let placeFilter = 'all';
let placeSort = 'stale';
let pickerMode = 'cook';     // which half of the day picker you're looking at
let rolledUp = false;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* esc() stops a URL breaking out of the attribute but not a javascript: one */
const safeUrl = u => /^https?:\/\//i.test(String(u ?? '').trim());

function todayKey(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function keyFor(offset){
  const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+offset);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function parseKey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d,12,0,0,0); }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }

const COOK_WORDS  = { never:'Never cooked', today:'Cooked today',   yesterday:'Cooked yesterday' };
const PLACE_WORDS = { never:'Never been',   today:'Ate here today', yesterday:'Ate here yesterday' };

function agoLabel(key, words){
  const w = words || COOK_WORDS;
  if(!key) return w.never;
  const n = daysBetween(parseKey(key), parseKey(todayKey()));
  if(n < 0) return 'Planned';
  if(n === 0) return w.today;
  if(n === 1) return w.yesterday;
  if(n < 14) return `${n} days ago`;
  if(n < 60) return `${Math.round(n/7)} weeks ago`;
  return `${Math.round(n/30)} months ago`;
}

/* Least recently used first — how you actually decide what to eat. */
const byStale = field => (a,b) =>
  (a[field]||'0000-00-00').localeCompare(b[field]||'0000-00-00');

const segHtml = (name, val) => `<div class="seg" data-seg="${name}">` +
  [1,2,3,4,5].map(n => `<button type="button" data-v="${n}" aria-pressed="${Number(val)===n}">${n}</button>`).join('') +
  `</div>`;

function wireSegs(root){
  root.querySelectorAll('[data-seg]').forEach(seg => {
    seg.querySelectorAll('button').forEach(b => b.onclick = () => {
      const on = b.getAttribute('aria-pressed') === 'true';
      seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed', on ? 'false' : 'true');
    });
  });
}
function perServing(r){
  const c = Number(r.cost)||0, s = Number(r.servings)||0;
  return s > 0 ? c/s : 0;
}
function money(n){ return '£' + (Math.round(n*100)/100).toFixed(2); }

/* Turns a save button into its own confirmation: Saving… then Saved, held long
   enough to read before the sheet closes or the tab switches. Anything that
   writes can fail — offline, or rules not published yet — and without this the
   view just changes and you assume it worked. */
async function withSaved(btn, work, done){
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    await work();
  } catch (e){
    btn.disabled = false; btn.textContent = label;
    toast("Didn't save — " + (e.code || e.message || 'try again'));
    return;
  }
  btn.textContent = 'Saved';
  btn.classList.add('is-saved');
  setTimeout(() => {
    btn.classList.remove('is-saved');
    btn.disabled = false; btn.textContent = label;
    if (done) done();
  }, 850);
}

/* Same idea for the sheet's other writes, which close the sheet on success. */
async function guard(work, okMsg){
  try { await work(); if (okMsg) toast(okMsg); return true; }
  catch (e){ toast("Didn't save — " + (e.code || e.message || 'try again')); return false; }
}

let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------- live data ---------- */
let started = false;
let unsubs = [];
let recipesLoaded = false, planLoaded = false, placesLoaded = false;

function startListening(user){
  if (started) return; started = true;
  const onErr = e => { if (e.code === 'permission-denied') denied(user); else toast('Connection problem'); };

  unsubs.push(onSnapshot(recipesCol, snap => {
    recipes = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    recipesLoaded = true;
    rollOldDays();
    render();
  }, onErr));

  unsubs.push(onSnapshot(placesCol, snap => {
    places = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    placesLoaded = true;
    rollOldDays();
    render();
  }, onErr));

  unsubs.push(onSnapshot(planCol, snap => {
    plan = {};
    snap.docs.forEach(d => { plan[d.id] = d.data(); });
    planLoaded = true;
    rollOldDays();
    render();
  }, onErr));

  unsubs.push(onSnapshot(shopDoc, snap => {
    shopping = snap.exists() ? snap.data() : null;
    render();
  }, onErr));
}

function stopListening(){
  unsubs.forEach(u => { try { u(); } catch(e){} });
  unsubs = [];
  started = false;
  recipesLoaded = planLoaded = placesLoaded = rolledUp = false;
  recipes = []; places = []; plan = {}; shopping = null;
}

/* Past planned dinners become "last cooked", then drop off the rail.
   Both listeners call this, but it waits for both: the recipe lookup below
   needs the recipes to be in hand, and two independent onSnapshot calls have
   no guaranteed order. Rolling early would delete the day without recording
   the date it was meant to save. */
async function rollOldDays(){
  if (rolledUp || !recipesLoaded || !planLoaded || !placesLoaded) return;
  const t = todayKey();
  const old = Object.keys(plan).filter(k => k < t);
  if (!old.length) return;
  rolledUp = true;
  for (const k of old){
    const entry = plan[k] || {};
    /* A past day logs itself against whichever it held — a recipe's last
       cooked date, or a place's last visited one. If the date fails to write,
       leave the day alone rather than destroying it; next load has another go. */
    if (entry.recipeId){
      const r = recipes.find(x => x.id === entry.recipeId);
      if (r && (!r.lastCooked || r.lastCooked < k)){
        try { await updateDoc(doc(recipesCol, entry.recipeId), { lastCooked: k }); }
        catch(e){ continue; }
      }
    } else if (entry.placeId){
      const p = places.find(x => x.id === entry.placeId);
      if (p && (!p.lastVisited || p.lastVisited < k)){
        try { await updateDoc(doc(placesCol, entry.placeId), { lastVisited: k }); }
        catch(e){ continue; }
      }
    }
    try { await deleteDoc(doc(planCol, k)); } catch(e){}
  }
}

/* ---------- filters ---------- */
function buildChips(){
  const opts = [
    {k:'all', label:'All'},
    ...COOKS.map(c => ({k:'fav:'+c.key, label:c.name + "'s favourites"})),
    {k:'vegetarian', label:'Vegetarian'},
    {k:'vegan', label:'Vegan'},
    {k:'meat', label:'Meat'},
  ];
  $('#filterChips').innerHTML = opts.map(o =>
    `<button class="chip" data-k="${o.k}" aria-pressed="${filter===o.k}">${esc(o.label)}</button>`).join('');
  $('#filterChips').querySelectorAll('.chip').forEach(c =>
    c.onclick = () => { filter = c.dataset.k; buildChips(); renderRecipes(); });
}
$('#search').addEventListener('input', e => { searchTerm = e.target.value.toLowerCase().trim(); renderRecipes(); });
$('#sortBy').addEventListener('change', e => { sortBy = e.target.value; renderRecipes(); });

function visibleRecipes(){
  let list = recipes.slice();
  if (filter.startsWith('fav:')){
    const k = filter.slice(4);
    list = list.filter(r => (r.favs||[]).includes(k));
  } else if (filter !== 'all'){
    list = list.filter(r => r.diet === filter);
  }
  if (searchTerm){
    list = list.filter(r =>
      (r.name||'').toLowerCase().includes(searchTerm) ||
      (r.ingredients||'').toLowerCase().includes(searchTerm));
  }
  const num = v => Number(v) || 0;
  const last = v => v > 0 ? v : 1e9;   // unpriced/untimed recipes sort to the bottom
  const cmp = {
    cost:  (a,b) => last(perServing(a)) - last(perServing(b)),
    health:(a,b) => num(b.health) - num(a.health),
    time:  (a,b) => last(num(a.cookTime)) - last(num(b.cookTime)),
    eat:   (a,b) => num(b.rEat) - num(a.rEat),
    wash:  (a,b) => num(b.rWash) - num(a.rWash),
    name:  (a,b) => (a.name||'').localeCompare(b.name||''),
    stale: (a,b) => (a.lastCooked||'0000-00-00').localeCompare(b.lastCooked||'0000-00-00'),
  }[sortBy];
  return list.sort(cmp);
}

function tagsHtml(r){
  const out = [];
  if (r.diet) out.push(`<span class="tag ${esc(r.diet)}">${r.diet==='vegetarian'?'Veg':esc(r.diet)}</span>`);
  (r.favs||[]).forEach(k => {
    const c = COOKS.find(x => x.key === k);
    if (c) out.push(`<span class="fav">${esc(c.name)}&rsquo;s pick</span>`);

function renderRecipes(){
  buildChips();
  const list = visibleRecipes();
  const host = $('#recipeList');
  if (!recipes.length){
    host.innerHTML = `<div class="empty"><h3>No recipes yet</h3>
      <p>Add the first one and it'll show up on both your phones.</p>
      <button class="btn" onclick="document.querySelector('.tab[data-view=add]').click()">Add a recipe</button></div>`;
    return;
  }
  if (!list.length){
    host.innerHTML = `<div class="empty"><h3>Nothing matches</h3><p>Try a different filter or search.</p></div>`;
    return;
  }
  host.innerHTML = list.map(r => {
    const bits = [];
    if (perServing(r)) bits.push(`<span><b>${money(perServing(r))}</b> a serving</span>`);
    if (Number(r.cookTime)) bits.push(`<span><b>${Number(r.cookTime)}</b> min</span>`);
    if (Number(r.health)) bits.push(`<span>health <b>${Number(r.health)}</b>/5</span>`);
    bits.push(`<span>${esc(agoLabel(r.lastCooked))}</span>`);
    return `<button class="ritem" data-id="${r.id}">
      <h3>${esc(r.name || 'Untitled')}</h3>

    </button>`;

function renderPlan(){
  const planned = Object.keys(plan).length;
  $('#planCount').textContent = planned
    ? `${planned} of the next 10 dinners planned`
    : 'Ten days ahead, dinners only';
  const t = todayKey();
  let html = '';
  for (let i = 0; i < 10; i++){
    const k = keyFor(i);
    const d = parseKey(k);
    const rid = plan[k]?.recipeId;
    const pid = plan[k]?.placeId;
    const r = rid ? recipes.find(x => x.id === rid) : null;
    const pl = pid ? places.find(x => x.id === pid) : null;
    const dow = i===0 ? 'Today' : i===1 ? 'Tmrw' : d.toLocaleDateString('en-GB',{weekday:'short'});
    let meal;
    if (r){
      const sub = [];
      if (perServing(r)) sub.push(money(perServing(r)) + ' a serving');
      if (Number(r.cookTime)) sub.push(Number(r.cookTime) + ' min');
      meal = `<span class="name">${esc(r.name)}</span>${sub.length?`<span class="sub">${esc(sub.join(' · '))}</span>`:''}`;
    } else if (pl){
      const sub = ['Eating out'];
      if (Number(pl.spend)) sub.push(money(Number(pl.spend)) + ' for two');
      meal = `<span class="name">${esc(pl.name)}</span><span class="sub">${esc(sub.join(' · '))}</span>`;
    } else if (rid){
      meal = `<span class="none">Recipe was deleted &mdash; tap to change</span>`;
    } else if (pid){
      meal = `<span class="none">Place was deleted &mdash; tap to change</span>`;
    } else {
      meal = `<span class="none">Nothing planned</span>`;
    }
    html += `<div class="day${k===t?' today':''}">
      <div class="daybtn" role="group">
        <button class="dstamp" data-pick="${k}" aria-label="Choose dinner for ${d.toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'})}" style="text-align:left">
          <span class="dow">${esc(dow)}</span><span class="num">${d.getDate()}</span>
        </button>
        <button class="dmeal" data-pick="${k}" style="text-align:left">${meal}</button>
        ${(rid || pid) ? `<button class="dclear" data-clear="${k}" aria-label="Clear this day">&times;</button>` : ''}
      </div></div>`;
  }
  $('#rail').innerHTML = html;
  $('#rail').querySelectorAll('[data-pick]').forEach(el =>
    el.onclick = () => openPicker(el.dataset.pick));
  $('#rail').querySelectorAll('[data-clear]').forEach(el =>
    el.onclick = async () => { await deleteDoc(doc(planCol, el.dataset.clear)); toast('Day cleared'); });
}

/* Only ever writes into empty fields, so neither the link fetch nor the
   screenshot reader can overwrite something you typed. Returns what it did. */
function fillBlanks(root, pairs){
  const filled = [];
  for (const [cls, label, value] of pairs){
    if (value === null || value === undefined || value === '') continue;
    const el = root.querySelector('.' + cls);
    if (!el || el.value.trim() !== '') continue;
    el.value = value;
    filled.push(label);
  }
  return filled;
}

/* Phone screenshots are several megabytes; the text is still perfectly legible
   at this size and the upload is far quicker. */
function shrinkImage(file, max = 1400){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      if (scale === 1 && file.size < 900000) return resolve(file);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => resolve(b || file), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That file is not an image.')); };
    img.src = url;
  });
}

async function readShot(root, file){
  const btn = root.querySelector('.f-shot');
  const msg = root.querySelector('.f-shotmsg');
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Reading…';
  msg.textContent = 'Reading the screenshot — this takes a few seconds.';
  try {
    const blob = await shrinkImage(file);
    const res = await fetch(FETCHER.replace(/\/+$/, '') + '/ocr', {
      method: 'POST',
      headers: { 'Content-Type': blob.type || 'image/jpeg' },
      body: blob,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Error ${res.status}`);

    const filled = fillBlanks(root, [
      ['f-name',   'name',        data.name],
      ['f-ing',    'ingredients', (data.ingredients || []).join('\n')],
      ['f-method', 'method',      (data.method || []).join('\n')],
    ]);
    msg.textContent = filled.length
      ? `Filled in ${filled.join(', ')}. Read it over — screenshots don't always come out perfectly.`
      : 'Nothing to fill in — those fields already have something in them.';
  } catch (e){
    msg.textContent = (e.message || 'Could not read that screenshot') + ' You can still type it in.';
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
}

/* Pulls what a recipe page publishes about itself through the Cloudflare
   worker and drops it into the form. Only ever fills blanks — anything you
   have already typed is left alone, and nothing is saved until you say so. */
async function fetchRecipe(root, btn){
  const url = root.querySelector('.f-url').value.trim();
  const msg = root.querySelector('.f-fetchmsg');
  if (!safeUrl(url)){ msg.textContent = 'Paste an http or https link first.'; return; }

  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Reading…';
  msg.textContent = 'Reading the page…';
  try {
    const res = await fetch(FETCHER + '?url=' + encodeURIComponent(url));
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Error ${res.status}`);

    const filled = fillBlanks(root, [
      ['f-name',   'name',        data.name],
      ['f-ing',    'ingredients', (data.ingredients || []).join('\n')],
      ['f-method', 'method',      (data.method || []).join('\n')],
      ['f-serv',   'servings',    data.servings],
      ['f-time',   'cook time',   data.cookTime],
    ]);

    /* servings feeds the per-serving hint */
    root.querySelector('.f-serv').dispatchEvent(new Event('input'));

    msg.textContent = filled.length
      ? `Filled in ${filled.join(', ')}. Check it over, then save.`
      : 'Nothing to fill in — those fields already have something in them.';
  } catch (e){
    msg.textContent = (e.message || 'Could not read that page') + ' Paste it in by hand instead.';
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
}

function readForm(root){
  const segVal = name => {
    const b = root.querySelector(`[data-seg="${name}"] [aria-pressed="true"]`);
    return b ? Number(b.dataset.v) : null;
  };
  const val = c => root.querySelector('.' + c).value;
  return {
    name: val('f-name').trim(),
    url: val('f-url').trim(),
    ingredients: val('f-ing'),
    method: val('f-method'),
    cost: val('f-cost') === '' ? null : Number(val('f-cost')),
    servings: val('f-serv') === '' ? null : Number(val('f-serv')),
    cookTime: val('f-time') === '' ? null : Number(val('f-time')),
    diet: val('f-diet') || null,
    favs: [...root.querySelectorAll('[data-fav][aria-pressed="true"]')].map(b => b.dataset.fav),
    health: segVal('health'), rMake: segVal('rMake'),
    rEat: segVal('rEat'), rWash: segVal('rWash'),
  };
}

let addFormBuilt = false;
function renderAddForm(){
  if (addFormBuilt) return;
  addFormBuilt = true;
  const host = $('#addFormHost');
  /* No ratings or favourites when adding: you can't rate a meal you haven't
     cooked, and a shorter form is a lower bar to getting the recipe in. */
  host.innerHTML = formHtml({}, 'add', false) +
    `<p class="hint" style="margin:-4px 0 14px">Ratings and favourites come later &mdash; open the recipe once it's saved.</p>
     <button class="btn btn-block" id="saveNew">Save recipe</button>`;
  wireForm(host, {});
  $('#saveNew').onclick = e => {
    const data = readForm(host);
    if (!data.name){ toast('Give it a name first'); host.querySelector('.f-name').focus(); return; }
    withSaved(e.currentTarget,
      () => addDoc(recipesCol, {...data, lastCooked: null, createdAt: serverTimestamp()}),
      () => {
        host.innerHTML = ''; addFormBuilt = false; renderAddForm();
        document.querySelector('.tab[data-view="recipes"]').click();
      });
  };
}

/* ---------- places we eat out ---------- */
function buildPlaceChips(){
  const opts = [{k:'all',label:'All'},{k:'new',label:'Want to try'},{k:'been',label:'Been'}];
  $('#placeChips').innerHTML = opts.map(o =>
    `<button class="chip" data-k="${o.k}" aria-pressed="${placeFilter===o.k}">${esc(o.label)}</button>`).join('');
  $('#placeChips').querySelectorAll('.chip').forEach(c =>
    c.onclick = () => { placeFilter = c.dataset.k; renderPlaces(); });
}

function renderPlaces(){
  buildPlaceChips();
  const host = $('#placeList');
  if (!places.length){
    host.innerHTML = `<div class="empty"><h3>Nowhere yet</h3>
      <p>Add somewhere you fancy trying &mdash; the name on its own is enough,
      and you can fill in the rest after you've been.</p></div>`;
    return;
  }
  let list = places.slice();
  if (placeFilter === 'new')  list = list.filter(p => !p.lastVisited);
  if (placeFilter === 'been') list = list.filter(p => p.lastVisited);

  const num = v => Number(v) || 0;
  list.sort({
    stale:  byStale('lastVisited'),
    rating: (a,b) => num(b.rating) - num(a.rating),
    spend:  (a,b) => (num(a.spend)||1e9) - (num(b.spend)||1e9),
    name:   (a,b) => (a.name||'').localeCompare(b.name||''),
  }[placeSort]);

  if (!list.length){
    host.innerHTML = `<div class="empty"><h3>Nothing matches</h3><p>Try a different filter.</p></div>`;
    return;
  }
  host.innerHTML = list.map(p => {
    const bits = [];
    if (Number(p.spend))  bits.push(`<span><b>${money(Number(p.spend))}</b> for two</span>`);
    if (Number(p.rating)) bits.push(`<span>rated <b>${Number(p.rating)}</b>/5</span>`);
    bits.push(`<span>${esc(agoLabel(p.lastVisited, PLACE_WORDS))}</span>`);
    return `<button class="ritem" data-id="${p.id}">
      <h3>${esc(p.name || 'Untitled')}</h3>
      ${!p.lastVisited ? `<div class="rtags"><span class="fav">Want to try</span></div>` : ''}
      <div class="rdata">${bits.join('<span class="sep">·</span>')}</div>
    </button>`;
  }).join('');
  host.querySelectorAll('.ritem').forEach(el => el.onclick = () => openPlace(el.dataset.id));
}

function placeFormHtml(p, prefix){
  return `
  <div class="field"><label for="${prefix}-name">Name</label>
    <input id="${prefix}-name" class="input p-name" value="${esc(p.name||'')}" placeholder="The Camberwell Arms"></div>

  <div class="field"><label for="${prefix}-url">Website</label>
    <input id="${prefix}-url" class="input p-url" type="url" inputmode="url" value="${esc(p.url||'')}" placeholder="https://"></div>

  <div class="field"><label for="${prefix}-spend">Typical spend for the two of you</label>
    <input id="${prefix}-spend" class="input p-spend" type="number" inputmode="decimal" step="1" min="0" value="${esc(p.spend ?? '')}" placeholder="60"></div>

  <div class="field"><label>How much you liked it &mdash; 5 is best</label>${segHtml('rating', p.rating)}</div>
  `;
}

function readPlaceForm(root){
  const v = c => root.querySelector('.' + c).value;
  const picked = root.querySelector('[data-seg="rating"] [aria-pressed="true"]');
  return {
    name: v('p-name').trim(),
    url: v('p-url').trim(),
    spend: v('p-spend') === '' ? null : Number(v('p-spend')),
    rating: picked ? Number(picked.dataset.v) : null,
  };
}

function openPlace(id){
  const p = places.find(x => x.id === id);
  if (!p) return;
  openSheet(p.name || 'Place', `
    <button class="btn btn-block" id="ateHere" style="margin-bottom:16px">Ate here today</button>
    ${safeUrl(p.url) ? `<p class="hint" style="margin:-8px 0 16px"><a href="${esc(p.url)}" target="_blank" rel="noopener">Visit the website</a></p>` : ''}
    ${placeFormHtml(p, 'place')}
    <div class="savebar">
      <button class="btn btn-ghost" id="savePlace">Save</button>
      <button class="btn" id="savePlaceClose">Save &amp; close</button>
    </div>
    <button class="btn btn-danger btn-block" id="delPlace" style="margin-top:10px">Delete place</button>
    <p class="hint" style="text-align:center;margin-top:14px">${esc(agoLabel(p.lastVisited, PLACE_WORDS))}</p>
  `);
  const body = $('#sheetBody');
  wireSegs(body);

  body.querySelector('#ateHere').onclick = async () => {
    if (await guard(() => updateDoc(doc(placesCol, p.id), { lastVisited: todayKey() }), 'Logged for today'))
      closeSheet();
  };
  const save = (btn, andClose) => {
    const data = readPlaceForm(body);
    if (!data.name){
      toast('Give it a name first');
      body.querySelector('.p-name').focus();
      return;
    }
    withSaved(btn, () => updateDoc(doc(placesCol, p.id), data), andClose ? closeSheet : null);
  };
  body.querySelector('#savePlace').onclick = e => save(e.currentTarget, false);
  body.querySelector('#savePlaceClose').onclick = e => save(e.currentTarget, true);
  body.querySelector('#delPlace').onclick = async () => {
    if (!confirm(`Delete "${p.name}"? This removes it for both of you.`)) return;
    if (await guard(() => deleteDoc(doc(placesCol, p.id)), 'Place deleted')) closeSheet();
  };
}

/* Quick add — a name is all it takes; the rest can wait until you've been. */
$('#addPlace').onclick = async () => {
  const input = $('#newPlace');
  const name = input.value.trim();
  if (!name){ input.focus(); return; }
  const ok = await guard(() => addDoc(placesCol, {
    name, url:'', spend:null, rating:null, lastVisited:null, createdAt: serverTimestamp(),
  }), 'Place added');
  if (ok){ input.value = ''; input.focus(); }
};
$('#newPlace').addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); $('#addPlace').click(); }
});
$('#placeSort').addEventListener('change', e => { placeSort = e.target.value; renderPlaces(); });

/* ---------- sheet ---------- */
const FOCUSABLE = 'button, a[href], input, select, textarea';
let lastFocus = null;

function openSheet(title, html){
  /* Redrawing an open sheet (the picker toggling Cook/Eat out) must not
     record a button inside the sheet as the place to return focus to. */
  if (!$('#sheet').classList.contains('open')) lastFocus = document.activeElement;
  $('#sheetTitle').textContent = title;
  $('#sheetBody').innerHTML = html;
  $('#sheet').classList.add('open');
  $('#sheetBg').classList.add('open');
  $('#sheetBody').scrollTop = 0;
  ($('#sheetBody').querySelector(FOCUSABLE) || $('#sheetClose')).focus();
}
function closeSheet(){
  if (!$('#sheet').classList.contains('open')) return;
  $('#sheet').classList.remove('open');
  $('#sheetBg').classList.remove('open');
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  lastFocus = null;
}
$('#sheetClose').onclick = closeSheet;
$('#sheetBg').onclick = closeSheet;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* aria-modal="true" has to be true: keep Tab inside the open sheet */
$('#sheet').addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  const f = [...$('#sheet').querySelectorAll(FOCUSABLE)]
    .filter(el => !el.disabled && el.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});

function openRecipe(id){
  const r = recipes.find(x => x.id === id);
  if (!r) return;
  /* Shown as steps above the form: when you open a recipe mid-cook you want to
     read the method, not scroll past a textarea of it. */
  const steps = (r.method || '').split('\n').map(s => s.trim()).filter(Boolean);
  openSheet(r.name || 'Recipe', `
    <div style="display:flex;gap:9px;margin-bottom:16px">
      <button class="btn" id="mkList" style="flex:1">Make shopping list</button>
      <button class="btn btn-ghost" id="cookedNow">Cooked today</button>
    </div>
    ${safeUrl(r.url) ? `<p class="hint" style="margin:-8px 0 16px"><a href="${esc(r.url)}" target="_blank" rel="noopener">Open the original recipe</a></p>` : ''}
    ${steps.length ? `<div class="method"><p class="eyebrow">Method</p>
      <ol>${steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol></div>` : ''}
    ${formHtml(r, 'edit', true)}
    <div class="savebar">
      <button class="btn btn-ghost" id="saveEdit">Save</button>
      <button class="btn" id="saveEditClose">Save &amp; close</button>
    </div>
    <button class="btn btn-danger btn-block" id="delRecipe" style="margin-top:10px">Delete recipe</button>
    <p class="hint" style="text-align:center;margin-top:14px">${esc(agoLabel(r.lastCooked))}</p>
  `);
  const body = $('#sheetBody');
  wireForm(body, r);

  body.querySelector('#mkList').onclick = async () => {
    const items = (r.ingredients||'').split('\n').map(s => s.trim())
      .filter(Boolean).map(text => ({text, checked:false}));
    if (!items.length){ toast('No ingredients on this recipe yet'); return; }
    const ok = await guard(() =>
      setDoc(shopDoc, { recipeId: r.id, recipeName: r.name || 'Shopping list', items }));
    if (!ok) return;
    closeSheet();
    document.querySelector('.tab[data-view="shop"]').click();
    toast('List ready');
  };
  body.querySelector('#cookedNow').onclick = async () => {
    if (await guard(() => updateDoc(doc(recipesCol, r.id), { lastCooked: todayKey() }), 'Logged for today'))
      closeSheet();
  };

  /* Save leaves the sheet open so you can keep editing; Save & close is the
     usual way out. Both confirm on the button itself. */
  const save = (btn, andClose) => {
    const data = readForm(body);
    if (!data.name){
      toast('Give it a name first');
      body.querySelector('.f-name').focus();
      return;
    }
    withSaved(btn, () => updateDoc(doc(recipesCol, r.id), data), andClose ? closeSheet : null);
  };
  body.querySelector('#saveEdit').onclick = e => save(e.currentTarget, false);
  body.querySelector('#saveEditClose').onclick = e => save(e.currentTarget, true);
  body.querySelector('#delRecipe').onclick = async () => {
    if (!confirm(`Delete "${r.name}"? This removes it for both of you.`)) return;
    if (await guard(() => deleteDoc(doc(recipesCol, r.id)), 'Recipe deleted')) closeSheet();
  };
}

function openPicker(dateKey){
  const d = parseKey(dateKey);
  const label = d.toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'});

  const draw = () => {
    const cook = pickerMode === 'cook';
    const items = cook ? recipes.slice().sort(byStale('lastCooked'))
                       : places.slice().sort(byStale('lastVisited'));
    const list = items.length
      ? items.map(x => `<button class="pickitem" data-id="${x.id}">
          <span class="nm">${esc(x.name || 'Untitled')}</span>
          <span class="mt">${esc(agoLabel(cook ? x.lastCooked : x.lastVisited,
                                          cook ? COOK_WORDS : PLACE_WORDS))}</span></button>`).join('')
      : `<div class="empty"><h3>${cook ? 'No recipes yet' : 'Nowhere yet'}</h3>
          <p>${cook ? 'Add one on the Add tab, then come back.'
                    : 'Add somewhere on the Out tab, then come back.'}</p></div>`;

    openSheet(label, `
      <div class="seg" style="margin-bottom:15px">
        <button type="button" data-mode="cook" aria-pressed="${cook}">Cook</button>
        <button type="button" data-mode="out" aria-pressed="${!cook}">Eat out</button>
      </div>
      <p class="eyebrow">${cook ? 'Least recently cooked first' : 'Least recently visited first'}</p>
      ${list}`);

    const body = $('#sheetBody');
    body.querySelectorAll('[data-mode]').forEach(b =>
      b.onclick = () => { pickerMode = b.dataset.mode; draw(); });
    body.querySelectorAll('[data-id]').forEach(el => el.onclick = async () => {
      const entry = cook ? { recipeId: el.dataset.id } : { placeId: el.dataset.id };
      if (await guard(() => setDoc(doc(planCol, dateKey), entry))){
        closeSheet(); toast('Added to the plan');
      }
    });
  };
  draw();
}

/* ---------- service worker ---------- */
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
